<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#060d1a"/>
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a3a6b" stroke-width="0.5" stroke-opacity="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <text x="600" y="300" font-family="Space Grotesk, sans-serif" font-size="72" font-weight="bold" fill="#E2E8F0" text-anchor="middle">SENTINEL</text>
  <text x="600" y="380" font-family="Space Grotesk, sans-serif" font-size="32" fill="#64748B" text-anchor="middle">Maritime Oil Spill Intelligence</text>
  
  <circle cx="600" cy="315" r="250" fill="none" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.2"/>
  <circle cx="600" cy="315" r="150" fill="none" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.3"/>
</svg>
